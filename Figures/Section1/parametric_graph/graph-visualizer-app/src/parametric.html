<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric functions</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="chart-container">
            <canvas id="leftChart" width="400" height="400"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="rightChart" width="400" height="400"></canvas>
        </div>
    </div>
    <div class="slider-container">
        <label for="tSlider">Select t (-1 to 1):</label>
        <input type="range" id="tSlider" min="-1" max="1" step="0.02" value="0">
        <span id="tValue">0</span>
    </div>
    <script src="app.js"></script>
</body>
</html>
