<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Plot with Sliders</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .chart-container {
        display: flex;
        justify-content: center; /* Horizontally center the chart */
        align-items: center;    /* Vertically center the chart */
        margin: 20px auto;
        }
        .slider-container {
        margin: 10px auto;
        display: flex;
        align-items: center; /* Align slider and label vertically */
        justify-content: center; /* Center the slider and label */
        }
        .slider-label {
            margin-right: 10px;
        }
        .slider-value {
            margin-left: 10px;
            display: inline-block;
            width: 40px; /* Fixed width to prevent shifting */
            text-align: left; /* Align text to the left */
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="lineChart" width="500" height="500"></canvas>
    </div>
    <div class="slider-container">
        <label class="slider-label" for="slopeSlider">Slope (m):</label>
        <input type="range" id="slopeSlider" min="-2" max="2" step="0.1" value="1">
        <span id="slopeValue" class="slider-value">1</span>
    </div>
    <div class="slider-container">
        <label class="slider-label" for="interceptSlider">Intercept (c):</label>
        <input type="range" id="interceptSlider" min="-5" max="5" step="0.2" value="0">
        <span id="interceptValue" class="slider-value">0</span>
    </div>

    <script>
        const ctx = document.getElementById('lineChart').getContext('2d');
        const slopeSlider = document.getElementById('slopeSlider');
        const interceptSlider = document.getElementById('interceptSlider');
        const slopeValue = document.getElementById('slopeValue');
        const interceptValue = document.getElementById('interceptValue');

        // Initial values for m and c
        let m = parseFloat(slopeSlider.value);
        let c = parseFloat(interceptSlider.value);

        // Generate x and y data for the line
        function generateLineData(m, c) {
            const x = Array.from({ length: 11 }, (_, i) => i - 5); // x values from -5 to 5
            const y = x.map(xi => m * xi + c);
            return { x, y };
        }

        // Initial line data
        const initialData = generateLineData(m, c);

        // Create the chart
        const lineChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: initialData.x,
                datasets: [{
                    label: 'y = mx + c',
                    data: initialData.y,
                    borderColor: 'blue',
                    borderWidth: 2,
                    fill: false,
                }]
            },
            options: {
                responsive: false,
                maintainAspectRatio: true,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: {
                            display: true,
                            text: 'x'
                        },
                        min: -5,
                        max: 5
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'y'
                        },
                        min:-5,
                        max: 5
                    }
                }
            }
        });

        updateChart(); // Initial chart update

        // Update the chart when sliders change
        function updateChart() {
            m = parseFloat(slopeSlider.value);
            c = parseFloat(interceptSlider.value);
            slopeValue.textContent = m;
            interceptValue.textContent = c;

            const newData = generateLineData(m, c);
            lineChart.data.labels = newData.x;
            lineChart.data.datasets[0].data = newData.y;
            lineChart.update();
        }

        slopeSlider.addEventListener('input', updateChart);
        interceptSlider.addEventListener('input', updateChart);
    </script>
</body>
</html>
